[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partwise-inspection"
version = "0.1.0"
description = "Computer vision for industrial anomaly detection and inspection decisions"
keywords = ["computer-vision", "anomaly-detection", "industrial-inspection", "patchcore"]
requires-python = ">=3.12,<3.13"

[project.scripts]
partwise = "partwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
